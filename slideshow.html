<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {box-sizing: border-box}
body {font-family: Verdana, sans-serif; margin:0}

img {vertical-align: middle;}

/* Slideshow container */
.slideshow-container {
  max-width: 1000px;
  position: relative;
  margin: auto;
}

/* Next & previous buttons */
.prev, .next {
  cursor: pointer;
  position: absolute;
  top: 50%;
  width: auto;
  padding: 16px;
  margin-top: -22px;
  color: white;
  font-weight: bold;
  font-size: 18px;
  transition: 0.6s ease;
  border-radius: 0 3px 3px 0;
  user-select: none;
  border: 0;
  background: transparent;
}

/* Position the "next button" to the right */
.next {
  right: 0;
  border-radius: 3px 0 0 3px;
}

/* On hover, add a black background color with a little bit see-through */
.prev:hover, .next:hover {
  background-color: rgba(0,0,0,0.8);
}

/* Caption text */
.text {
  color: #f2f2f2;
  font-size: 15px;
  padding: 8px 12px;
  position: absolute;
  bottom: 8px;
  width: 100%;
  text-align: center;
}

/* Number text (1/3 etc) */
.numbertext {
  color: #f2f2f2;
  font-size: 12px;
  padding: 8px 12px;
  position: absolute;
  top: 0;
}

/* The dots/bullets/indicators */
.dot {
  cursor: pointer;
  height: 15px;
  width: 15px;
  margin: 0 2px;
  background-color: #bbb;
  border-radius: 50%;
  display: inline-block;
  padding: 0;
  border: 0;
  transition: background-color 0.6s ease;
}

.active, .dot:hover {
  background-color: #717171;
}

/* Fading animation */
.fade {
  -webkit-animation-name: fade;
  -webkit-animation-duration: 1.5s;
  animation-name: fade;
  animation-duration: 1.5s;
}

@-webkit-keyframes fade {
  from {opacity: .4} 
  to {opacity: 1}
}

@keyframes fade {
  from {opacity: .4} 
  to {opacity: 1}
}

/* On smaller screens, decrease text size */
@media only screen and (max-width: 300px) {
  .prev, .next,.text {font-size: 11px}
}
</style>
</head>
<body>

<div class="slideshow-container">

<div class="slide fade">
  <div class="numbertext">1 / 3</div>
  <img src="websiteAssets/optimized/art/painting1.webp" style="width:100%" loading="eager" fetchpriority="high" decoding="async">
  <div class="text">Caption Text</div>
</div>

<div class="slide fade">
  <div class="numbertext">2 / 3</div>
  <img src="websiteAssets/optimized/art/painting2.webp" style="width:100%" loading="lazy" decoding="async">
  <div class="text">Caption Two</div>
</div>
<div class="slide fade">
  <div class="numbertext">3 / 3</div>
  <img src="websiteAssets/optimized/art/painting3.webp" style="width:100%" loading="lazy" decoding="async">
  <div class="text">Caption Three</div>
</div>

<button type="button" class="prev" data-slide-step="-1" aria-label="Previous image">&#10094;</button>
<button type="button" class="next" data-slide-step="1" aria-label="Next image">&#10095;</button>

<div class="slide-indicators" style="text-align:center">
  <button type="button" class="dot" data-slide-index="0" aria-label="Show image 1"></button>
  <button type="button" class="dot" data-slide-index="1" aria-label="Show image 2"></button>
  <button type="button" class="dot" data-slide-index="2" aria-label="Show image 3"></button>
</div>

</div>

<script src="main.js" defer></script>
</body>
</html>
